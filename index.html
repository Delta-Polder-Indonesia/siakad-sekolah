    <!-- Critical CSS: hero LCP paints before React / Tailwind CSS arrive -->
    <style>
      html,body{height:100%;margin:0;background:#0f172a}
      html.is-authed #lcp-shell{display:none!important}
      #lcp-hero{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
      #lcp-scrim{position:fixed;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,.4),rgba(0,0,0,.1),rgba(0,0,0,.5));pointer-events:none}
      #lcp-ui{position:fixed;inset:0;z-index:2;pointer-events:none;color:#fff;font-family:system-ui,-apple-system,sans-serif}
      #lcp-header{position:absolute;left:0;right:0;top:0;padding:1.5rem}
      #lcp-header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1400px;margin:0 auto}
      #lcp-brand{display:flex;align-items:center;gap:.75rem}
      #lcp-brand img{width:2.75rem;height:2.75rem;object-fit:contain}
      #lcp-brand h1{margin:0;font-size:.875rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
      #lcp-masuk{border:2px solid rgba(255,255,255,.7);border-radius:9999px;padding:.625rem 1.5rem;font-size:.875rem;font-weight:600}
      #lcp-caption{position:absolute;left:0;right:0;bottom:0;padding:0 1.5rem 3rem}
      #lcp-caption-inner{max-width:1400px;margin:0 auto}
      #lcp-crumb{font-size:.75rem;color:rgba(255,255,255,.7);margin:0 0 1.5rem}
      #lcp-caption h2{margin:0 0 .5rem;font-size:1.875rem;font-weight:700;color:rgba(255,255,255,.9);line-height:1.25}
      #lcp-caption p{margin:0;max-width:900px;font-size:.875rem;line-height:2;color:rgba(255,255,255,.9)}
      #lcp-shell[data-hydrated] #lcp-scrim,
      #lcp-shell[data-hydrated] #lcp-ui{display:none}
      #root{position:relative;z-index:3;min-height:100%}
    </style>
    <script>
      try{if(localStorage.getItem('absensi_auth'))document.documentElement.classList.add('is-authed')}catch(e){}
    </script>

  <body>
    <!-- Static LCP hero: image + heading paint without waiting for JS.
         React keeps #lcp-hero in the DOM (slide 0 is transparent) so LCP
         does not reset when the app mounts. -->
    <div id="lcp-shell">
      <img
        id="lcp-hero"
        alt="Fasilitas Pembelajaran Modern"
        width="1920"
        height="752"
        fetchpriority="high"
        decoding="sync"
        src="%BASE_URL%images/Dashboard/Konoha-1-768.webp"
        srcset="%BASE_URL%images/Dashboard/Konoha-1-768.webp 768w, %BASE_URL%images/Dashboard/Konoha-1-1280.webp 1280w, %BASE_URL%images/Dashboard/Konoha-1.webp 1350w"
        sizes="100vw"
      />
      <div id="lcp-scrim" aria-hidden="true"></div>
      <div id="lcp-ui">
        <header id="lcp-header">
          <div id="lcp-header-inner">
            <div id="lcp-brand">
              <img src="%BASE_URL%images/logo/logo-sekolah.svg" alt="" width="44" height="44" />
              <h1>SMA NEGERI 1 MEDAN</h1>
            </div>
            <span id="lcp-masuk">Masuk</span>
          </div>
        </header>
        <div id="lcp-caption">
          <div id="lcp-caption-inner">
            <p id="lcp-crumb">Beranda / Fasilitas Pembelajaran Modern</p>
            <h2>Fasilitas Pembelajaran Modern</h2>
            <p>Ruang kelas berteknologi tinggi yang mendukung proses belajar mengajar untuk mencetak generasi unggul.</p>
          </div>
        </div>
      </div>
    </div>

      </div>
